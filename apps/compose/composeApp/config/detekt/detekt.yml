build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true

processors:
  active: true

console-reports:
  active: true

output-reports:
  active: true
  exclude:
    - 'HtmlOutputReport'
    - 'TxtOutputReport'

comments:
  active: true
  AbsentOrWrongFileLicense:
    active: false
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

complexity:
  active: true
  # Compose screens are often large single composables; keep soft ceilings only.
  LongMethod:
    active: true
    threshold: 900
  LongParameterList:
    active: true
    functionThreshold: 24
    constructorThreshold: 12
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: true
    thresholdInFiles: 40
    thresholdInClasses: 30
  ComplexCondition:
    active: true
    threshold: 6
  LargeClass:
    active: true
    threshold: 1200
  CyclomaticComplexMethod:
    active: true
    threshold: 100
  NestedBlockDepth:
    active: true
    threshold: 6

coroutines:
  active: true

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    active: true
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Za-z0-9]*'
  VariableNaming:
    active: true

performance:
  active: true

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: false

style:
  active: true
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  ReturnCount:
    active: true
    max: 6
  ThrowsCount:
    active: true
    max: 5
  MaxLineLength:
    active: true
    maxLineLength: 140
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true
  UseRequire:
    active: false
  UseCheckOrError:
    active: false
  ExplicitItLambdaParameter:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
