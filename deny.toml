# ADR-0028: MIT crates must not depend on libsignal; the client is AGPL.

[graph]
all-features = false

[advisories]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "AGPL-3.0",
    "AGPL-3.0-only",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "ISC AND MIT AND OpenSSL",
    "MIT AND ISC AND OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"
# ADR-0028: MIT crates must not pull libsignal. Only AGPL `nemo-core` may wrap it.

[[bans.deny]]
name = "libsignal-protocol"
wrappers = ["nemo-core"]
reason = "ADR-0028"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
