[package]
name = "nemo-wire"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Nemo Messenger version-1 encodings shared by client and server (MIT). No libsignal."
readme = false

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
rand = "0.8"
rand_core = { version = "0.9", features = ["os_rng"] }
sha2 = "0.10"
thiserror = "2"
