[package]
name = "nemo-wire"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Nemo Messenger version-1 encodings shared by client and server (MIT). No libsignal."
readme = false

[dependencies]
base64 = "0.23"
ed25519-dalek = { version = "3", features = ["rand_core"] }
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha"] }
rand = "0.10"
rand_core = "0.10"
sha2 = "0.11"
thiserror = "2"
