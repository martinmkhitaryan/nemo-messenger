[package]
name = "nemo-core"
version = "0.1.0"
edition.workspace = true
license = "AGPL-3.0-only"
description = "Nemo client core: identity, PQXDH, Double Ratchet, MLS. AGPL because it links libsignal."
readme = false
repository.workspace = true

[dependencies]
argon2 = "0.5"
async-trait = "0.1"
bip39 = "2"
futures = { version = "0.3", features = ["executor"] }
libsignal-protocol = { git = "https://github.com/signalapp/libsignal.git", tag = "v0.99.0" }
nemo-wire = { path = "../nemo-wire" }
rand = "0.8"
rand09 = { package = "rand", version = "0.9", features = ["os_rng"] }
openmls = "0.6.0"
openmls_basic_credential = "0.3.0"
openmls_rust_crypto = "0.3.0"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
dirs = "6"
tls_codec = { version = "0.4.1", features = ["std"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webrtc = "0.20"
rtc = "0.20"
bytes = "1.12.1"
libopus_sys = { version = "0.3", features = ["bundled", "static"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
webrtc-audio-processing = { version = "2.1", features = ["bundled"] }
keyring = "3"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-body-util = "0.1"
nemo-server = { path = "../nemo-server" }
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
