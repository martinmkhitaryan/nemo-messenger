[package]
name = "nemo-ffi"
version = "0.1.0"
edition.workspace = true
license = "AGPL-3.0-only"
description = "UniFFI surface over nemo-core. AGPL because it links libsignal."
readme = false
repository.workspace = true

[lib]
name = "nemo_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
nemo-core = { path = "../nemo-core" }
nemo-wire = { path = "../nemo-wire" }
thiserror = "2"
uniffi = "0.29"
