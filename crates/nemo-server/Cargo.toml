[package]
name = "nemo-server"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Blind delivery: mailboxes, capabilities, group streams. MUST NOT depend on libsignal or nemo-core."
readme = false
repository.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "matched-path", "ws"] }
nemo-wire = { path = "../nemo-wire" }
rand = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
ring = { version = "0.17", default-features = false, features = ["std"] }
base64 = "0.22"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
x509-parser = "0.17"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
