services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nemo
      POSTGRES_PASSWORD: nemo
      POSTGRES_DB: nemo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../crates/nemo-server/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemo"]
      interval: 2s
      timeout: 5s
      retries: 20

  nemo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      NEMO_LISTEN: 0.0.0.0:8787
      NEMO_HOST: localhost
      NEMO_S2S_PORT: "9443"
      NEMO_S2S_LISTEN: 0.0.0.0:9443
      DATABASE_URL: postgres://nemo:nemo@postgres:5432/nemo
    expose:
      - "8787"
      - "9443"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - nemo

volumes:
  pgdata:
