services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nemo
      # Reference default only; set NEMO_POSTGRES_PASSWORD before a real deploy.
      POSTGRES_PASSWORD: ${NEMO_POSTGRES_PASSWORD:-nemo}
      POSTGRES_DB: nemo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../crates/nemo-server/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemo"]
      interval: 2s
      timeout: 5s
      retries: 20

  nemo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      NEMO_LISTEN: 0.0.0.0:8787
      NEMO_HOST: localhost
      NEMO_S2S_PORT: "9443"
      NEMO_S2S_LISTEN: 0.0.0.0:9443
      DATABASE_URL: postgres://nemo:${NEMO_POSTGRES_PASSWORD:-nemo}@postgres:5432/nemo
    expose:
      - "8787"
      - "9443"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - nemo

  # Optional 1:1 media relay (ADR-0024 / ADR-0028). Credentials are a reference
  # default, not identity. Enable with: docker compose --profile calls up
  coturn:
    image: coturn/coturn:4.6-alpine
    profiles: ["calls"]
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49152
      - --max-port=49200
      - --fingerprint
      - --lt-cred-mech
      - --user=nemo:nemo
      - --realm=nemo.local
      - --no-cli
      - --no-tls
      - --no-dtls
      - --listening-ip=0.0.0.0
      - --allow-loopback-peers
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"

volumes:
  pgdata:
