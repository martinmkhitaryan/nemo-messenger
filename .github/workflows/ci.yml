name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native audio build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config clang libclang-dev
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so*' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/lib/gcc/$(gcc -dumpmachine)/$(gcc -dumpversion)/include" >> "$GITHUB_ENV"
      - name: Test workspace
        run: cargo test --workspace
      - name: MIT crates must not link libsignal
        run: cargo test -p nemo-wire -p nemo-server --test no_libsignal
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compose two-vault exchange
        working-directory: apps/compose
        run: ./gradlew --no-daemon desktopTest

  windows-ffi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build nemo_ffi.dll
        run: cargo build -p nemo-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: nemo-ffi-windows
          path: target/debug/nemo_ffi.dll

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Assemble debug APK
        working-directory: apps/compose
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nemo-debug-apk
          path: apps/compose/build/outputs/apk/debug/*.apk
