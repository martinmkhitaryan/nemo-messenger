name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Native audio build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config clang libclang-dev protobuf-compiler
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so*' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/lib/gcc/$(gcc -dumpmachine)/$(gcc -dumpversion)/include" >> "$GITHUB_ENV"
      - name: Test workspace
        run: cargo test --workspace
      - name: MIT crates must not link libsignal
        run: cargo test -p nemo-wire -p nemo-server --test no_libsignal
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Compose two-vault exchange
        working-directory: apps/compose
        run: ./gradlew --no-daemon desktopTest

  windows-ffi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: llvm-tools
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # 55ef6a3 was green because APM was unix-only. Since 82cab75 Windows
      # compiles webrtc-audio-processing. MSVC cl + Strawberry perl, no MinGW.
      # Short CARGO_TARGET_DIR (MAX_PATH). Meson cpp_std=c++20: APM uses
      # designated initializers that MSVC rejects under C++17 (C7555).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Meson for desktop APM
        run: pip install meson ninja
      - name: Build nemo_ffi.dll
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          $env:Path = ($env:Path.Split(';') | Where-Object {
            $_ -and ($_ -notmatch 'mingw|msys64|Strawberry[\\/]+c[\\/]')
          }) -join ';'
          $strawberryPerl = "C:\Strawberry\perl\bin"
          $strawberryPerlExe = Join-Path $strawberryPerl "perl.exe"
          if (-not (Test-Path $strawberryPerlExe)) {
            throw "Strawberry perl.exe not found (openssl-src / sqlcipher)"
          }
          $env:Path = "$strawberryPerl;$env:Path"
          $env:PERL = $strawberryPerlExe
          $env:OPENSSL_SRC_PERL = $strawberryPerlExe
          $env:CC = "cl"
          $env:CXX = "cl"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $clangBin = Join-Path $vs "VC\Tools\Llvm\x64\bin"
          if (Test-Path (Join-Path $clangBin "libclang.dll")) {
            $env:LIBCLANG_PATH = $clangBin
          }
          $gitUsr = "C:\Program Files\Git\usr\bin"
          if (Test-Path (Join-Path $gitUsr "cp.exe")) {
            $env:Path = "$env:Path;$gitUsr"
          }
          $mesonReal = (Get-Command meson).Source
          $shim = Join-Path $env:RUNNER_TEMP "build-shims"
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          Set-Content -Path (Join-Path $shim "nm.cmd") -Value "@echo off`r`nexit /b 0"
          Set-Content -Path (Join-Path $shim "meson.cmd") -Value @"
@echo off
if /I "%~1"=="setup" (
  "$mesonReal" %* -Dcpp_std=c++20
) else (
  "$mesonReal" %*
)
"@
          $env:Path = "$shim;$env:Path"
          Write-Host "CC=$env:CC CXX=$env:CXX"
          foreach ($tool in @("cl", "clang", "cc", "c++", "perl", "meson", "ninja", "nm", "cp", "link")) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            Write-Host "${tool}: $(if ($cmd) { $cmd.Source } else { 'missing' })"
          }
          if (-not (Get-Command cl -ErrorAction SilentlyContinue)) { throw "cl.exe not on PATH" }
          $link = Get-Command link -ErrorAction SilentlyContinue
          if (-not $link -or $link.Source -match "Git[\\/]usr") { throw "MSVC link.exe not first on PATH: $($link.Source)" }
          $cc = Get-Command cc -ErrorAction SilentlyContinue
          if ($cc -and $cc.Source -match "Strawberry|mingw") { throw "cc is still MinGW: $($cc.Source)" }
          $perl = Get-Command perl -ErrorAction SilentlyContinue
          if (-not $perl) { throw "perl not on PATH" }
          if ($perl.Source -match "Git[\\/]usr") { throw "perl is Git MSYS, not Strawberry: $($perl.Source)" }
          cargo build -p nemo-ffi
      - uses: actions/upload-artifact@v5
        with:
          name: nemo-ffi-windows
          path: ${{ runner.temp }}/cargo-target/debug/nemo_ffi.dll

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: nttld/setup-ndk@v1.6.0
        id: ndk
        with:
          ndk-version: r27c
      # Google removed the legacy `tools` package. cmdline-tools come from this action.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator'
      - name: Native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config clang libclang-dev protobuf-compiler
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so*' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/lib/gcc/$(gcc -dumpmachine)/$(gcc -dumpversion)/include" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Assemble debug APK
        working-directory: apps/compose
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # emulator-runner runs each script line as its own `sh -c`, so a for-loop there is invalid.
      - name: Start home for emulator
        run: |
          cargo build -p nemo-server
          unset DATABASE_URL
          NEMO_LISTEN=0.0.0.0:18787 NEMO_S2S_LISTEN=127.0.0.1:19443 nohup ./target/debug/nemo-server >/tmp/nemo-server.log 2>&1 &
          for i in $(seq 1 100); do
            if curl -sf http://127.0.0.1:18787/v1/bundle >/dev/null; then exit 0; fi
            sleep 0.3
          done
          echo "nemo-server did not become ready" >&2
          cat /tmp/nemo-server.log >&2 || true
          exit 1
      - name: Instrumented tests on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2.37.0
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd apps/compose && ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v5
        with:
          name: nemo-debug-apk
          path: apps/compose/build/outputs/apk/debug/*.apk
