name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Native audio build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config clang libclang-dev protobuf-compiler
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so*' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/lib/gcc/$(gcc -dumpmachine)/$(gcc -dumpversion)/include" >> "$GITHUB_ENV"
      - name: Test workspace
        run: cargo test --workspace
      - name: MIT crates must not link libsignal
        run: cargo test -p nemo-wire -p nemo-server --test no_libsignal
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Compose two-vault exchange
        working-directory: apps/compose
        run: ./gradlew --no-daemon desktopTest

  windows-ffi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: llvm-tools
      # APM needs rust-objcopy (symbol tools) and a real llvm-nm for POSIX
      # output. dtolnay/rust-toolchain does not always leave them on disk.
      - name: Ensure llvm-tools for APM
        shell: pwsh
        run: |
          rustup component add llvm-tools
          $rustcHost = (rustc -vV | Select-String '^host:').ToString().Split()[-1]
          $toolsBin = Join-Path (rustc --print sysroot) "lib\rustlib\$rustcHost\bin"
          if (-not (Test-Path $toolsBin)) { throw "rustlib tools bin missing: $toolsBin" }
          $rustObjcopy = Join-Path $toolsBin "rust-objcopy.exe"
          if (-not (Test-Path $rustObjcopy)) {
            foreach ($cand in @("llvm-objcopy.exe", "llvm-objcopy")) {
              $src = Join-Path $toolsBin $cand
              if (Test-Path $src) { Copy-Item -Force $src $rustObjcopy; break }
            }
          }
          if (-not (Test-Path $rustObjcopy)) {
            Get-ChildItem $toolsBin | ForEach-Object { $_.Name }
            throw "rust-objcopy.exe missing after llvm-tools"
          }
          # build.rs joins "rust-objcopy" with no .exe; Path::exists is false on Windows.
          $rustObjcopyNoExt = Join-Path $toolsBin "rust-objcopy"
          if (-not (Test-Path $rustObjcopyNoExt)) {
            Copy-Item -Force $rustObjcopy $rustObjcopyNoExt
          }
          $llvmNm = Join-Path $toolsBin "llvm-nm.exe"
          if (-not (Test-Path $llvmNm)) {
            Get-ChildItem $toolsBin | ForEach-Object { $_.Name }
            throw "llvm-nm.exe missing after llvm-tools"
          }
          Write-Host "rust-objcopy=$rustObjcopy"
          Write-Host "llvm-nm=$llvmNm"
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # 55ef6a3 was green because APM was unix-only. Since 82cab75 Windows
      # compiles webrtc-audio-processing. MSVC cl + Strawberry perl, no MinGW.
      # Short CARGO_TARGET_DIR (MAX_PATH). Cargo Command::new("meson") runs
      # meson.exe (not meson.cmd). A meson.exe shim adds -Dcpp_std=c++20 on
      # setup so APM gets MSVC C++20 (C7555). Do not shim cl.exe: that breaks
      # openssl-src nmake OPENSSLDIR quoting (SYS$MANAGER / ct_log.c).
      # APM also needs nm.exe (not nm.cmd), Git cp, libclang, and a patched
      # build.rs (GCC flags / skip MSVC symbol prefix / mirror lib*.a → *.lib).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Meson for desktop APM
        run: pip install meson ninja
      - name: Build nemo_ffi.dll
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/cargo-target
        run: |
          $env:Path = ($env:Path.Split(';') | Where-Object {
            $_ -and ($_ -notmatch 'mingw|msys64|Strawberry[\\/]+c[\\/]')
          }) -join ';'
          $strawberryPerl = "C:\Strawberry\perl\bin"
          $strawberryPerlExe = Join-Path $strawberryPerl "perl.exe"
          if (-not (Test-Path $strawberryPerlExe)) {
            throw "Strawberry perl.exe not found (openssl-src / sqlcipher)"
          }
          $env:Path = "$strawberryPerl;$env:Path"
          $env:PERL = $strawberryPerlExe
          $env:OPENSSL_SRC_PERL = $strawberryPerlExe
          $env:CC = "cl"
          $env:CXX = "cl"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $clangBin = Join-Path $vs "VC\Tools\Llvm\x64\bin"
          $libclang = Join-Path $clangBin "libclang.dll"
          if (-not (Test-Path $libclang)) {
            throw "libclang.dll not found for bindgen (VS LLVM): $libclang"
          }
          $env:LIBCLANG_PATH = $clangBin
          $gitUsr = "C:\Program Files\Git\usr\bin"
          $gitCp = Join-Path $gitUsr "cp.exe"
          if (-not (Test-Path $gitCp)) {
            throw "Git cp.exe not found (APM build.rs Command::new(cp)): $gitCp"
          }
          # Append (don't prepend): keep MSVC link.exe first. Rust Command::new("cp")
          # finds cp.exe on PATH; PowerShell's `cp` alias is unrelated.
          $env:Path = "$env:Path;$gitUsr"
          $mesonReal = (Get-Command meson).Source
          if (-not $mesonReal) { throw "meson not on PATH before shim" }
          $env:NEMO_REAL_MESON = $mesonReal
          $shim = Join-Path $env:RUNNER_TEMP "build-shims"
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          # Prefer rustup llvm-nm (POSIX flags); fall back to Git MinGW nm + DLLs.
          $shimNm = Join-Path $shim "nm.exe"
          $rustcHost = (rustc -vV | Select-String '^host:').ToString().Split()[-1]
          $nmCandidates = @(
            (Join-Path (rustc --print sysroot) "lib\rustlib\$rustcHost\bin\llvm-nm.exe"),
            (Join-Path $clangBin "llvm-nm.exe"),
            "C:\Program Files\Git\mingw64\bin\nm.exe"
          )
          $nmSrc = $nmCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nmSrc) { throw "nm.exe not found (llvm-tools / VS LLVM / Git mingw64)" }
          Copy-Item -Force $nmSrc $shimNm
          if ($nmSrc -match '[\\/]mingw64[\\/]') {
            $mingwBin = Split-Path $nmSrc
            foreach ($dll in @("libwinpthread-1.dll", "libgcc_s_seh-1.dll", "zlib1.dll")) {
              $dllPath = Join-Path $mingwBin $dll
              if (Test-Path $dllPath) { Copy-Item -Force $dllPath $shim }
            }
          }
          & $shimNm --version
          if ($LASTEXITCODE -ne 0) { throw "shim nm.exe failed --version" }
          $mesonShimC = Join-Path $env:RUNNER_TEMP "nemo-meson-shim.c"
          $mesonShimLines = @(
            '#define _CRT_SECURE_NO_WARNINGS',
            '#define WIN32_LEAN_AND_MEAN',
            '#include <windows.h>',
            '#include <stdio.h>',
            '#include <stdlib.h>',
            '#include <string.h>',
            'static int append_quoted(char *dst, size_t cap, size_t *pos, const char *arg) {',
            '  size_t n = *pos, alen = strlen(arg);',
            '  if (n + alen + 4 >= cap) return -1;',
            '  if (n) dst[n++] = '' '';',
            '  dst[n++] = ''"'';',
            '  memcpy(dst + n, arg, alen); n += alen;',
            '  dst[n++] = ''"'';',
            '  dst[n] = 0; *pos = n; return 0;',
            '}',
            'int main(int argc, char **argv) {',
            '  const char *real = getenv("NEMO_REAL_MESON");',
            '  char cmdline[32768]; size_t pos = 0; int i, is_setup = 0, has_std = 0;',
            '  STARTUPINFOA si; PROCESS_INFORMATION pi; DWORD code = 1;',
            '  if (!real || !real[0]) { fprintf(stderr, "NEMO_REAL_MESON not set\n"); return 1; }',
            '  cmdline[0] = 0;',
            '  if (append_quoted(cmdline, sizeof(cmdline), &pos, real) != 0) return 1;',
            '  for (i = 1; i < argc; i++) {',
            '    if (strcmp(argv[i], "setup") == 0) is_setup = 1;',
            '    if (strncmp(argv[i], "-Dcpp_std=", 10) == 0) has_std = 1;',
            '    if (append_quoted(cmdline, sizeof(cmdline), &pos, argv[i]) != 0) return 1;',
            '  }',
            '  if (is_setup && !has_std) {',
            '    if (append_quoted(cmdline, sizeof(cmdline), &pos, "-Dcpp_std=c++20") != 0) return 1;',
            '  }',
            '  memset(&si, 0, sizeof(si)); si.cb = sizeof(si);',
            '  if (!CreateProcessA(real, cmdline, NULL, NULL, TRUE, 0, NULL, NULL, &si, &pi)) {',
            '    fprintf(stderr, "CreateProcess meson failed: %lu\n", GetLastError()); return 1;',
            '  }',
            '  WaitForSingleObject(pi.hProcess, INFINITE);',
            '  GetExitCodeProcess(pi.hProcess, &code);',
            '  CloseHandle(pi.hProcess); CloseHandle(pi.hThread);',
            '  return (int)code;',
            '}'
          )
          Set-Content -Path $mesonShimC -Value $mesonShimLines -Encoding ascii
          $shimMeson = Join-Path $shim "meson.exe"
          $clReal = (Get-Command cl).Source
          if (-not $clReal) { throw "cl.exe not on PATH" }
          & $clReal /nologo /O2 "/Fe:$shimMeson" $mesonShimC
          if (-not (Test-Path $shimMeson)) { throw "failed to build meson.exe C++20 shim" }
          $env:Path = "$shim;$env:Path"
          Write-Host "CC=$env:CC CXX=$env:CXX LIBCLANG_PATH=$env:LIBCLANG_PATH"
          foreach ($tool in @("cl", "clang", "cc", "c++", "perl", "meson", "ninja", "nm", "cp.exe", "link")) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            Write-Host "${tool}: $(if ($cmd) { $cmd.Source } else { 'missing' })"
          }
          $meson = Get-Command meson -ErrorAction SilentlyContinue
          if (-not $meson) { throw "meson not on PATH" }
          if ($meson.Source -ne $shimMeson) { throw "meson is not the C++20 shim: $($meson.Source)" }
          $nm = Get-Command nm -ErrorAction SilentlyContinue
          if (-not $nm) { throw "nm not on PATH" }
          if ($nm.Source -ne $shimNm) { throw "nm is not shim nm.exe: $($nm.Source)" }
          $cp = Get-Command cp.exe -ErrorAction SilentlyContinue
          if (-not $cp -or $cp.Source -ne $gitCp) { throw "cp.exe must be Git usr: $($cp.Source)" }
          $cl = Get-Command cl -ErrorAction SilentlyContinue
          if (-not $cl) { throw "cl.exe not on PATH" }
          if ($cl.Source -match '[\\/]build-shims[\\/]') { throw "cl must be real MSVC, not a shim: $($cl.Source)" }
          $link = Get-Command link -ErrorAction SilentlyContinue
          if (-not $link -or $link.Source -match "Git[\\/]usr") { throw "MSVC link.exe not first on PATH: $($link.Source)" }
          $cc = Get-Command cc -ErrorAction SilentlyContinue
          if ($cc -and $cc.Source -match "Strawberry|mingw") { throw "cc is still MinGW: $($cc.Source)" }
          $perl = Get-Command perl -ErrorAction SilentlyContinue
          if (-not $perl) { throw "perl not on PATH" }
          if ($perl.Source -match "Git[\\/]usr") { throw "perl is Git MSYS, not Strawberry: $($perl.Source)" }
          & python "$env:GITHUB_WORKSPACE\scripts\ci\windows-apm-patch-build-rs.py"
          cargo build -p nemo-ffi
      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: nemo-ffi-windows
          path: ${{ runner.temp }}/cargo-target/debug/nemo_ffi.dll
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: nttld/setup-ndk@v1.6.0
        id: ndk
        with:
          ndk-version: r27c
      # Google removed the legacy `tools` package. cmdline-tools come from this action.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator'
      - name: Native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config clang libclang-dev protobuf-compiler
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so*' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/lib/gcc/$(gcc -dumpmachine)/$(gcc -dumpversion)/include" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Assemble debug APK
        working-directory: apps/compose
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # emulator-runner runs each script line as its own `sh -c`, so a for-loop there is invalid.
      - name: Start home for emulator
        run: |
          cargo build -p nemo-server
          unset DATABASE_URL
          NEMO_LISTEN=0.0.0.0:18787 NEMO_S2S_LISTEN=127.0.0.1:19443 nohup ./target/debug/nemo-server >/tmp/nemo-server.log 2>&1 &
          for i in $(seq 1 100); do
            if curl -sf http://127.0.0.1:18787/v1/bundle >/dev/null; then exit 0; fi
            sleep 0.3
          done
          echo "nemo-server did not become ready" >&2
          cat /tmp/nemo-server.log >&2 || true
          exit 1
      - name: Instrumented tests on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2.37.0
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd apps/compose && ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: nemo-debug-apk
          path: apps/compose/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
