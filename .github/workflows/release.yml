name: release

# Builds release artifacts and publishes them on the tag's GitHub Release.
# Tags look like `v0.4.5`. Android release APKs stay debug-signed for
# sideload (see androidApp/build.gradle.kts); swap in a real keystore
# before Play / wide distribution.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: nttld/setup-ndk@v1.6.0
        id: ndk
        with:
          ndk-version: r27c
      # Google removed the legacy `tools` package; keep in sync with ci.yml.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config clang libclang-dev protobuf-compiler
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so*' | head -n1)")" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/lib/gcc/$(gcc -dumpmachine)/$(gcc -dumpversion)/include" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Android release APKs (debug-signed sideload)
        working-directory: apps/compose
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Desktop .deb
        working-directory: apps/compose
        run: ./gradlew --no-daemon packageDeb
      - name: Server release binary
        run: cargo build --release -p nemo-server
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/compose/androidApp/build/outputs/apk/release/*.apk
            apps/compose/composeApp/build/compose/binaries/main/deb/*.deb
            target/release/nemo-server
